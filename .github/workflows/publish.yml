name: Publish to PyPI

# Publishes on every GitHub Release via PyPI Trusted Publishing (OIDC) —
# no API token/secret is stored. The matching trusted publisher on PyPI must
# name this repo, this workflow file (publish.yml), and the "pypi" environment.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Run test suite
        run: |
          python -m pip install pytest
          python -m pip install dist/*.whl
          python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
