[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblical-transliteration"
version = "0.3.1"
description = "Biblical Hebrew and Koine Greek transliteration in three schemes (SBL, Simple, Phonetic)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Curran Gehring" },
]
keywords = [
    "hebrew",
    "greek",
    "koine",
    "transliteration",
    "sbl",
    "biblical-studies",
    "septuagint",
    "new-testament",
    "hebrew-bible",
    "nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Religion",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Religion",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/curran-gehring/biblical-transliteration"
Repository = "https://github.com/curran-gehring/biblical-transliteration"
Issues = "https://github.com/curran-gehring/biblical-transliteration/issues"

[tool.hatch.build.targets.wheel]
packages = ["biblical_transliteration"]
artifacts = ["biblical_transliteration/data/*.json"]

[tool.hatch.build.targets.sdist]
include = [
    "biblical_transliteration",
    "tests",
    "tools",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
